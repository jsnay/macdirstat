name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (human tag in a
# comment) so a compromised/retagged upstream release can't alter the build
# that produces the app (supply-chain hardening, app#9).
jobs:
  build-and-test:
    name: Build + test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: macdirstat

      # The app links the real Rust engine — the seam is tested, never
      # mocked. Prefer the engine branch matching this branch; fall back
      # to main.
      - name: Checkout dirstat-core
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git clone --depth 1 --branch "$BRANCH" \
            https://github.com/jsnay/dirstat-core dirstat-core \
            || git clone --depth 1 https://github.com/jsnay/dirstat-core dirstat-core

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build engine + app
        working-directory: macdirstat
        run: make build DIRSTAT_CORE_DIR=../dirstat-core

      - name: Tests
        working-directory: macdirstat
        run: swift test
